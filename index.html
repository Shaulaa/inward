<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inward: Perjalanan ke Dalam Tubuh Manusia</title>
    <meta name="description" content="Scroll ke dalam tubuh manusia: dari permukaan kulit, menembus pembuluh darah, sel, dan inti sel, sampai heliks DNA. Perjalanan 3D interaktif." />
    <meta name="theme-color" content="#2a0407" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social previews. VITE_SITE_URL (see .env) must be the deployed origin: crawlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Inward" />
    <meta property="og:title" content="Inward: Perjalanan ke Dalam Tubuh Manusia" />
    <meta property="og:description" content="Scroll dari permukaan kulit sampai heliks DNA, menembus pembuluh darah, sel, dan inti sel. Perjalanan 3D interaktif." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Heliks ganda DNA berwarna ungu dengan pasangan basa berwarna, di akhir perjalanan Inward." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Inward: Perjalanan ke Dalam Tubuh Manusia" />
    <meta name="twitter:description" content="Scroll dari permukaan kulit sampai heliks DNA, menembus pembuluh darah, sel, dan inti sel." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta name="twitter:image:alt" content="Heliks ganda DNA berwarna ungu dengan pasangan basa berwarna, di akhir perjalanan Inward." />
  </head>
  <body>
    <canvas id="webgl" role="img" aria-label="Animasi 3D: kamera menembus kulit, pembuluh darah, sel dan inti sel sampai ke DNA."></canvas>

    <header class="brand" aria-hidden="true">
      <span class="brand__name">Inward</span>
      <span class="brand__tag">Perjalanan ke dalam tubuh manusia</span>
    </header>

    <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Suara" aria-pressed="false" title="Suara: mati" hidden>
      <svg class="sound-toggle__icon" viewBox="0 0 28 24" width="22" height="19" aria-hidden="true" focusable="false">
        <path class="sound-toggle__speaker" d="M3 9h4l6-5v16l-6-5H3z" />
        <line class="sound-toggle__mute" x1="2" y1="3" x2="23" y2="21" />
        <rect class="sound-toggle__bar" x="16.5" y="9" width="2" height="6" rx="1" />
        <rect class="sound-toggle__bar" x="20.5" y="6.5" width="2" height="11" rx="1" />
        <rect class="sound-toggle__bar" x="24.5" y="9" width="2" height="6" rx="1" />
      </svg>
    </button>

    <p id="scroll-hint" class="scroll-hint">Scroll untuk masuk</p>
    <section id="fallback" class="fallback" aria-live="polite" hidden></section>

    <main id="track" class="track"></main>

    <noscript>
      <section class="fallback">
        <div class="fallback__card">
          <p class="fallback__brand">Inward</p>
          <h1 class="fallback__title">Inward butuh JavaScript</h1>
          <p class="fallback__text">Perjalanan 3D ke dalam tubuh ini dijalankan dengan JavaScript. Aktifkan JavaScript di browser lalu muat ulang halaman.</p>
        </div>
      </section>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
